services:
  app:
    image: n2f:v1.0.0
    container_name: n2f-app
    restart: always
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=sbsoft2026
      - PGPASSWORD=sbsoft2026
      - PGDATABASE=sbsoft2026
      - JAVA_XMX=4096m
      - APP_MODE=prod
      - APP_LANGUAGE=fr
      - APP_DEMO_DATA=false
      # Décommentez et mettez une vraie clé générée avec `openssl rand -base64 32` pour la production
      # - ENCRYPTION_PASSWORD=VotreCleSecreteGeneree
    ports:
      - "8080:8080"
    volumes:
      - /mnt/data/axelor-data:/data
      - ./post-startup.d:/usr/local/bin/post-startup.d:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  db:
    image: postgres:18
    container_name: n2f-db
    restart: always
    environment:
      - POSTGRES_USER=sbsoft2026
      - POSTGRES_PASSWORD=sbsoft2026
      - POSTGRES_DB=sbsoft2026
    volumes:
      # 👇 CORRECTION ICI : On monte sur /var/lib/postgresql (sans /data) pour la v18
      - /mnt/data/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbsoft2026 -d sbsoft2026"]
      interval: 10s
      timeout: 5s
      retries: 5